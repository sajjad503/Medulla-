    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;

        function FakeViteSocket() {
          this.readyState = 1; // WebSocket.OPEN
          this.OPEN = 1;
          this.CLOSED = 3;
          this.CLOSING = 2;
          this.CONNECTING = 0;
          this._listeners = {};
        }
        FakeViteSocket.prototype.addEventListener = function(type, listener) {
          if (!this._listeners[type]) this._listeners[type] = [];
          this._listeners[type].push(listener);
          if (type === 'open') {
            setTimeout(function() {
              try { listener({ type: 'open' }); } catch (e) {}
            }, 0);
          }
        };
        FakeViteSocket.prototype.removeEventListener = function(type, listener) {
          if (!this._listeners[type]) return;
          this._listeners[type] = this._listeners[type].filter(function(l) { return l !== listener; });
        };
        FakeViteSocket.prototype.send = function() {};
        FakeViteSocket.prototype.close = function() {
          this.readyState = 3;
        };
        FakeViteSocket.prototype.dispatchEvent = function() { return true; };

        window.WebSocket = function(url, protocols) {
          if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1))) {
            return new FakeViteSocket();
          }
          return new NativeWebSocket(url, protocols);
        };
        window.WebSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket.OPEN = NativeWebSocket.OPEN || 1;
        window.WebSocket.CLOSED = NativeWebSocket.CLOSED || 3;
        window.WebSocket.CLOSING = NativeWebSocket.CLOSING || 2;
        window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING || 0;

        window.addEventListener('error', function(e) {
          var msg = String(e && (e.message || (e.error && e.error.message)) || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws://') !== -1 || msg.indexOf('wss://') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = String(e && (e.reason && (e.reason.message || e.reason)) || '');
          if (reason.indexOf('WebSocket') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
